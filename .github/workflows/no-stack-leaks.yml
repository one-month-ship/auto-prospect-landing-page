name: no-stack-leaks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-stack-leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aucun nom de fournisseur ni detail d'implementation dans le contenu publie
        run: node scripts/check-stack-leaks.mjs
